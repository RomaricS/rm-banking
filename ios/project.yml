# Generate the Xcode project with:  brew install xcodegen && cd ios && xcodegen
name: Akwe
options:
  bundleIdPrefix: com.wakalo
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: App/Config/App.xcconfig
  Release: App/Config/App.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: $(AKWE_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.20.0"
  LinkKit:
    url: https://github.com/plaid/plaid-link-ios-spm
    from: "5.6.0"
  AkweKit:
    path: Packages/AkweKit

targets:
  Akwe:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Config/*.xcconfig"
          - "Config/*.example"
      # XcodeGen has no `resources:` key; localized strings must be a source with a resources build phase.
      - path: Shared/Localization
        buildPhase: resources
    dependencies:
      - package: Supabase
      - package: LinkKit
      - package: AkweKit
      - target: AkweWidgets
        embed: true
    entitlements:
      path: App/Akwe.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        aps-environment: development
        com.apple.security.application-groups: [group.com.wakalo.akwe]
        com.apple.developer.associated-domains: ["applinks:$(AKWE_LINK_DOMAIN)"]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: akwe
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: akwe uses Face ID to keep your finances private.
        UIBackgroundModes: [remote-notification, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.wakalo.akwe.refresh]
        CFBundleURLTypes:
          - CFBundleURLName: com.wakalo.akwe
            CFBundleURLSchemes: [akwe]
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        AKWE_LINK_DOMAIN: $(AKWE_LINK_DOMAIN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wakalo.akwe
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"

  AkweWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared/Localization
        buildPhase: resources
    dependencies:
      - package: AkweKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widgets/AkweWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.wakalo.akwe]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: akwe
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wakalo.akwe.widgets
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  Akwe:
    build:
      targets:
        Akwe: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: AkweKit/AkweKitTests
